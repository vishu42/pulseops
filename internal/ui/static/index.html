<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PulseOps</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="app-header">
      <div>
        <p class="eyebrow">Uptime monitor</p>
        <h1>PulseOps</h1>
      </div>
      <div class="health" id="healthBadge">Checking API</div>
    </header>

    <main class="shell">
      <section class="panel companies-panel" aria-labelledby="companiesTitle">
        <div class="panel-header">
          <div>
            <p class="eyebrow">Groups</p>
            <h2 id="companiesTitle">Companies</h2>
          </div>
          <button class="icon-button" id="refreshButton" type="button" title="Refresh">↻</button>
        </div>

        <form class="stacked-form" id="companyForm">
          <label>
            Name
            <input id="companyName" name="name" autocomplete="organization" placeholder="Acme" required />
          </label>
          <label>
            Slug
            <input id="companySlug" name="slug" autocomplete="off" placeholder="acme" required />
          </label>
          <button type="submit">Create Company</button>
        </form>

        <div class="list" id="companiesList"></div>
      </section>

      <section class="panel urls-panel" aria-labelledby="urlsTitle">
        <div class="panel-header">
          <div>
            <p class="eyebrow" id="selectedCompanyEyebrow">No company selected</p>
            <h2 id="urlsTitle">Monitored URLs</h2>
          </div>
          <input class="search" id="urlSearch" type="search" placeholder="Search URLs" />
        </div>

        <div class="toolbar">
          <span id="urlCount">0 URLs</span>
          <span id="selectedCompanySlug"></span>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>URL</th>
                <th>Method</th>
                <th>Interval</th>
                <th>Timeout</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="urlsTable"></tbody>
          </table>
        </div>

        <div class="probe-detail" id="probeDetail">
          <div class="detail-header">
            <div>
              <p class="eyebrow">Probe summary</p>
              <h3 id="probeTitle">Select a monitor</h3>
            </div>
            <select id="historyWindow">
              <option value="6">6h</option>
              <option value="24" selected>24h</option>
              <option value="168">7d</option>
            </select>
          </div>

          <div class="metric-grid">
            <div class="metric">
              <span>Latest</span>
              <strong id="latestOutcome">-</strong>
            </div>
            <div class="metric">
              <span>Status</span>
              <strong id="latestStatusCode">-</strong>
            </div>
            <div class="metric">
              <span>Latency</span>
              <strong id="latestLatency">-</strong>
            </div>
            <div class="metric">
              <span>Checked</span>
              <strong id="latestCheckedAt">-</strong>
            </div>
          </div>

          <div class="table-wrap buckets-wrap">
            <table>
              <thead>
                <tr>
                  <th>5 min window</th>
                  <th>Avg latency</th>
                  <th>Uptime</th>
                  <th>Checks</th>
                  <th>Last</th>
                </tr>
              </thead>
              <tbody id="probeBuckets"></tbody>
            </table>
          </div>
        </div>
      </section>

      <section class="panel add-url-panel" aria-labelledby="addUrlTitle">
        <div class="panel-header">
          <div>
            <p class="eyebrow">Monitor</p>
            <h2 id="addUrlTitle">Add URL</h2>
          </div>
        </div>

        <form class="stacked-form" id="urlForm">
          <label>
            URL
            <input id="urlValue" name="url" type="url" placeholder="https://example.com/health" required />
          </label>
          <div class="field-grid">
            <label>
              Method
              <select id="urlMethod" name="method">
                <option>GET</option>
                <option>HEAD</option>
              </select>
            </label>
            <label>
              Interval
              <input id="urlInterval" name="interval" type="number" min="10" value="60" />
            </label>
          </div>
          <div class="field-grid">
            <label>
              Timeout
              <input id="urlTimeout" name="timeout" type="number" min="500" step="500" value="5000" />
            </label>
            <label>
              Expected
              <input id="urlExpected" name="expected" value="200-399" />
            </label>
          </div>
          <button type="submit">Add Monitor</button>
        </form>

        <div class="message" id="message" role="status"></div>
      </section>
    </main>

    <script src="/app.js" defer></script>
  </body>
</html>
