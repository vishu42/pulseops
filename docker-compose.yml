services:
  api-server:
    build:
      context: .
      args:
        SERVICE: api-server
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HTTP_ADDR: :8081
      DATABASE_URL: postgres://pulseops:pulseops@postgres:5432/pulseops?sslmode=disable
      KAFKA_BROKERS: redpanda:29092
      CHECK_JOBS_TOPIC: pulseops.url-check-jobs.v1
      CHECK_RESULTS_TOPIC: pulseops.url-check-results.v1
    ports:
      - "8081:8081"

  scheduler:
    build:
      context: .
      args:
        SERVICE: scheduler
    depends_on:
      postgres:
        condition: service_healthy
      kafka-topics:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://pulseops:pulseops@postgres:5432/pulseops?sslmode=disable
      KAFKA_BROKERS: redpanda:29092
      CHECK_JOBS_TOPIC: pulseops.url-check-jobs.v1
      SCHEDULER_BATCH: 100
      SCHEDULER_TICK: 10s

  status-checker:
    build:
      context: .
      args:
        SERVICE: status-checker
    depends_on:
      kafka-topics:
        condition: service_completed_successfully
    environment:
      KAFKA_BROKERS: redpanda:29092
      CHECK_JOBS_TOPIC: pulseops.url-check-jobs.v1
      CHECK_RESULTS_TOPIC: pulseops.url-check-results.v1
      CHECKER_TIMEOUT: 5s

  status-writer:
    build:
      context: .
      args:
        SERVICE: status-writer
    depends_on:
      postgres:
        condition: service_healthy
      kafka-topics:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://pulseops:pulseops@postgres:5432/pulseops?sslmode=disable
      KAFKA_BROKERS: redpanda:29092
      CHECK_RESULTS_TOPIC: pulseops.url-check-results.v1

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pulseops
      POSTGRES_PASSWORD: pulseops
      POSTGRES_DB: pulseops
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulseops -d pulseops"]
      interval: 10s
      timeout: 5s
      retries: 5

  redpanda:
    image: redpandadata/redpanda:v24.3.5
    command:
      - redpanda
      - start
      - --smp
      - "1"
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --overprovisioned
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - internal://0.0.0.0:29092,external://0.0.0.0:9092
      - --advertise-kafka-addr
      - internal://redpanda:29092,external://localhost:9092
    ports:
      - "9092:9092"
      - "9644:9644"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
      - ./scripts:/scripts:ro
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 10s
      timeout: 5s
      retries: 10

  redpanda-console:
    image: redpandadata/console:v2.8.3
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: redpanda:29092
    ports:
      - "8080:8080"

  kafka-topics:
    image: redpandadata/redpanda:v24.3.5
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      BROKERS: redpanda:29092
    entrypoint: ["/bin/sh"]
    command: ["/scripts/create-kafka-topics.sh"]
    volumes:
      - ./scripts:/scripts:ro
    restart: "no"

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: pulseops
      MINIO_ROOT_PASSWORD: pulseops-dev-password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redpanda_data:
  minio_data:
